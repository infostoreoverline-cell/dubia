<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioTwin API Server</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f11;
            color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { color: #30d158; }
        code {
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
            color: #ff9500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪲 BioTwin API Online</h1>
        <p>Il server backend è attivo e funzionante su Vercel.</p>
        <p>Endpoint disponibili:</p>
        <ul style="list-style: none; padding: 0; line-height: 1.8;">
            <li><code>GET /api/registry</code></li>
            <li><code>GET /api/readings</code></li>
            <li><code>POST /api/ingest</code></li>
        </ul>
        <p style="margin-top: 30px; font-size: 0.9rem; color: #888;">Questo è solo il motore dati API. Usa la webapp per la Dashboard.</p>
    </div>
</body>
</html>
